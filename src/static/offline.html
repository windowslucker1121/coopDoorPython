<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coop offline</title>
<style>
  :root { --bg:#EEF1F4; --card:#fff; --ink:#1B2430; --muted:#5B6776; --primary:#1F3A5F; --accent:#C27A08; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F141A; --card:#18202A; --ink:#E7ECF2; --muted:#9AA6B4; --primary:#F2B24B; --accent:#F2B24B; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:16px; padding:32px 28px; max-width:380px; text-align:center;
          box-shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); }
  h1 { font-size:1.35rem; margin:12px 0 6px; }
  p { color:var(--muted); margin:0 0 20px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:10px 18px; background:var(--primary);
           color:var(--card); cursor:pointer; }
  svg { color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/><rect x="8.5" y="12" width="7" height="9"/></svg>
  <h1>The coop can't be reached</h1>
  <p>Check that this device is on the coop's network and that the controller is powered.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
